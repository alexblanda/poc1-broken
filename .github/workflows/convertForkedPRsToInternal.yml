name: Convert Fork PR to Internal (PoC mirror - pull_request_target)
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  launder:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Launder fork PR content to internal branch + open internal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FORK_REF: ${{ github.event.pull_request.head.ref }}
          PRNUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "LAUNDER_FIRED: pull_request_target auto-ran for fork PR #$PRNUM from $FORK_REPO ($FORK_REF) with NO approval gate in workflow"
          git config user.name poc-bot; git config user.email poc-bot@example.com
          NEW="fork-pr-${PRNUM}-${GITHUB_RUN_ID}"
          git remote add fork "https://github.com/${FORK_REPO}.git"
          git fetch fork "$FORK_REF"
          git checkout -b "$NEW" FETCH_HEAD
          git push origin "$NEW"
          echo "LAUNDERED: pushed internal branch $NEW carrying fork content verbatim"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$NEW" --base main --title "internal: laundered #$PRNUM" --body "laundered by poc" && echo "INTERNAL_PR_OPENED" || echo "pr create rc=$?"
